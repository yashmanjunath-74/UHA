<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Registration - Security</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#009669",
              "background-light": "#f6f8f8",
              "background-dark": "#10221f",
              "surface-light": "#ffffff",
              "surface-dark": "#1c2e2b",
            },
            fontFamily: {
              "display": ["Poppins", "sans-serif"],
              "body": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>input[type="checkbox"]:checked {
            background-color: #009669;
            border-color: #009669;
        }
        input[type="checkbox"]:focus {
            box-shadow: 0 0 0 2px rgba(0, 150, 105, 0.4);
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center items-start">
<div class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative overflow-hidden shadow-2xl">
<div class="h-12 w-full shrink-0"></div>
<header class="flex items-center justify-between px-4 pb-4">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold text-slate-900 dark:text-white">Security</h2>
<div class="w-10"></div> 
</header>
<main class="flex-1 overflow-y-auto no-scrollbar px-6 pb-24">
<div class="mb-8 mt-2">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Step 3 of 3</span>
<span class="text-xs font-medium text-primary">100%</span>
</div>
<div class="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
</div>
<div class="mb-8">
<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">Secure Your Account</h1>
<p class="text-slate-500 dark:text-slate-400 leading-relaxed font-body">Create a secure password to protect your personal health data.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault()">
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-surface-light dark:bg-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 font-body" id="email" placeholder="name@example.com" type="email" value="alex.doe@example.com"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Create Password</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-12 rounded-xl border border-slate-200 dark:border-slate-700 bg-surface-light dark:bg-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 font-body" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="pt-2 space-y-2">
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400">Strength: <span class="text-primary font-medium">Good</span></p>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-12 rounded-xl border border-slate-200 dark:border-slate-700 bg-surface-light dark:bg-surface-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 font-body" id="confirm-password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<label class="flex items-start gap-3 p-1 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-slate-300 dark:border-slate-600 transition-all checked:bg-primary checked:border-primary hover:border-primary" type="checkbox"/>
<span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 text-white pointer-events-none">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</span>
</div>
<span class="text-sm text-slate-600 dark:text-slate-300 leading-snug select-none font-body">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </span>
</label>
</form>
</main>
<div class="absolute bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark p-6 border-t border-slate-100 dark:border-slate-800">
<button class="w-full h-14 bg-primary hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
<span>Complete Registration</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>

</body></html>
