<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hospital Registration - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0bda95",
                        "primary-dark": "#09af78",
                        "background-light": "#f5f8f7",
                        "background-dark": "#10221c",
                        "surface-light": "#ffffff",
                        "surface-dark": "#18322a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* iOS-like input focus */
        .ios-input:focus {
            outline: none;
            border-color: #0bda95;
            box-shadow: 0 0 0 4px rgba(11, 218, 149, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 min-h-screen flex justify-center items-start pt-0 sm:pt-10 pb-0 sm:pb-10">
<!-- Mobile Container (Phone Frame simulation on desktop, full width on mobile) -->
<div class="w-full max-w-md h-screen sm:h-[844px] bg-surface-light dark:bg-surface-dark sm:rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col sm:border-8 sm:border-slate-900">
<!-- Status Bar Area (simulated) -->
<div class="h-12 w-full flex justify-between items-center px-6 pt-2 select-none z-20 bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md sticky top-0">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-[18px]">signal_cellular_alt</span>
<span class="material-icons text-[18px]">wifi</span>
<span class="material-icons text-[18px]">battery_full</span>
</div>
</div>
<!-- Navigation Bar -->
<div class="px-4 py-3 flex items-center justify-between z-10 sticky top-12 bg-surface-light dark:bg-surface-dark">
<button class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-500 dark:text-slate-400">
<span class="material-icons">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center">
<span class="text-xs uppercase tracking-widest text-primary font-bold">Registration</span>
</div>
<button class="p-2 -mr-2 text-primary font-medium text-sm">
                Help
            </button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-32">
<!-- Header Section -->
<div class="mt-2 mb-8">
<h1 class="text-2xl font-bold mb-2 text-slate-900 dark:text-white">Institution Profile</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                    Please provide the official details of your medical institution to begin the verification process.
                </p>
</div>
<!-- Progress Bar -->
<div class="mb-10">
<div class="flex justify-between text-xs font-semibold mb-2">
<span class="text-primary">Step 1 of 3</span>
<span class="text-slate-400">33%</span>
</div>
<div class="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full shadow-[0_0_10px_rgba(11,218,149,0.5)]"></div>
</div>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Hospital Name -->
<div class="space-y-1.5 group">
<label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wide ml-1" for="hospitalName">Hospital / Clinic Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
<span class="material-icons text-[20px]">local_hospital</span>
</div>
<input class="ios-input w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:bg-white dark:focus:bg-surface-dark transition-all" id="hospitalName" placeholder="e.g. City General Hospital" type="text"/>
</div>
</div>
<!-- Institution Type -->
<div class="space-y-1.5 group relative">
<label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wide ml-1" for="institutionType">Institution Type</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
<span class="material-icons text-[20px]">domain</span>
</div>
<select class="ios-input w-full pl-11 pr-10 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white appearance-none focus:bg-white dark:focus:bg-surface-dark transition-all cursor-pointer" id="institutionType">
<option disabled="" selected="" value="">Select type...</option>
<option value="government">Government Hospital</option>
<option value="private">Private Clinic/Hospital</option>
<option value="diagnostic">Diagnostic Center</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
<span class="material-icons">expand_more</span>
</div>
</div>
</div>
<!-- Registration Number -->
<div class="space-y-1.5 group">
<label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wide ml-1" for="regNumber">Registration Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
<span class="material-icons text-[20px]">badge</span>
</div>
<input class="ios-input w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:bg-white dark:focus:bg-surface-dark transition-all" id="regNumber" placeholder="Official License No." type="text"/>
</div>
<p class="text-[10px] text-slate-400 ml-1">Located on your MoH certification document.</p>
</div>
<!-- Primary Contact Person -->
<div class="space-y-1.5 group">
<label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wide ml-1" for="contactPerson">Primary Contact Person</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
<span class="material-icons text-[20px]">person</span>
</div>
<input class="ios-input w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:bg-white dark:focus:bg-surface-dark transition-all" id="contactPerson" placeholder="Admin Full Name" type="text"/>
</div>
</div>
</form>
<!-- Decorative Subtle Pattern for "Medical" feel -->
<div class="mt-12 flex justify-center opacity-10 dark:opacity-5 pointer-events-none">
<svg class="text-primary" fill="currentColor" height="120" viewbox="0 0 24 24" width="120">
<path d="M19 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM11 17H13V13H17V11H13V7H11V11H7V13H11V17Z"></path>
</svg>
</div>
</div>
<!-- Sticky Footer Action Button -->
<div class="absolute bottom-0 left-0 right-0 p-6 pb-8 bg-gradient-to-t from-surface-light via-surface-light to-transparent dark:from-surface-dark dark:via-surface-dark dark:to-transparent z-20">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold text-lg py-4 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                Next Step
                <span class="material-icons text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Home Indicator (iOS) -->
<div class="w-1/3 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mt-6"></div>
</div>
</div>
</body></html>
