<body class="bg-gray-100 dark:bg-background-dark font-display text-neutral-900 dark:text-neutral-50 antialiased h-screen flex justify-center items-center overflow-hidden">
<div class="w-full h-full sm:h-[844px] sm:w-[390px] sm:rounded-[40px] sm:border-8 sm:border-neutral-900 bg-background-light dark:bg-background-dark relative flex flex-col shadow-2xl overflow-hidden">

<span class="material-icons text-[16px]">wifi</span>
<span class="material-icons text-[16px]">battery_full</span>
</div>
</div>
<div class="flex items-center justify-between px-4 py-3 z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors">
<span class="material-icons text-neutral-900 dark:text-white">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-semibold text-neutral-900 dark:text-white">Basic Information</h1>
<div class="w-10"></div>
</div>
<div class="px-6 py-4">

</div>
<div class="w-full h-2 bg-neutral-100 dark:bg-neutral-800 rounded-full overflow-hidden">

</div>
</div>
<div class="flex-1 overflow-y-auto px-6 pb-32 scrollbar-hide">
<div class="mb-6">

<p class="text-sm text-neutral-500 dark:text-neutral-400">Please provide your basic information to set up your patient profile.</p>
</div>
<form class="space-y-6">
<div class="flex justify-center mb-6">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-neutral-50 dark:bg-neutral-800 flex items-center justify-center border-2 border-dashed border-primary group-hover:bg-primary-light transition-all overflow-hidden relative">
<div class="flex flex-col items-center justify-center z-10">
<span class="material-icons text-3xl text-primary mb-1">camera_alt</span>
<span class="text-[10px] text-primary font-medium">Add Photo</span>
</div>
<img alt="Profile upload placeholder" class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-10 transition-opacity" data-alt="Abstract placeholder for user profile photo upload" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDc7iPfeBZ7S15WnkuFDMSqXPPqW554Sj3A1xV49_PdjBdMaqv4e6jTLEr7_WS2wa-g_eQpYl2AYsMZpFXkimGH1Y_8YpI1MbClj-R8Qr-t1a6oofdLojbCHmRcxMLKQ55DVABoki0LaLcAG4gUCwwCnO9oi_mdkdSzSxtSF65ZcsHEwuXBqZIdDXKoVUXCFaQ1o8v-J9MvBbELcd_14fTfWVUd83fYqMR6NaFWf4T0i9tU5EFskEQjxT_4UkG3UdFp2E26rKNGFSp0"/>
</div>
<div class="absolute bottom-1 right-1 bg-primary text-white rounded-full p-2 border-[3px] border-white dark:border-background-dark shadow-sm">
<span class="material-icons text-[16px] block">edit</span>
</div>
</div>
</div>
<div class="group">
<label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2 ml-1" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-icons text-neutral-400 text-[20px] group-focus-within:text-primary transition-colors">person_outline</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-2xl text-neutral-900 dark:text-white placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm text-[15px]" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<div class="group">
<label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2 ml-1" for="dob">Date of Birth</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-icons text-neutral-400 text-[20px] group-focus-within:text-primary transition-colors">calendar_today</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-2xl text-neutral-900 dark:text-white placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700/50 text-[15px]" id="dob" placeholder="MM/DD/YYYY" readonly="" type="text"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-icons text-neutral-400 text-[20px]">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2 ml-1">Gender</label>
<div class="grid grid-cols-3 gap-3">
<button class="relative flex flex-col items-center justify-center py-3 px-2 rounded-2xl bg-primary-light border border-primary text-primary transition-all group shadow-sm" type="button">
<span class="material-icons text-[20px] mb-1">male</span>
<span class="text-xs font-semibold">Male</span>
<div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary"></div>
</button>
<button class="flex flex-col items-center justify-center py-3 px-2 rounded-2xl bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 hover:border-primary/50 hover:text-primary text-neutral-500 dark:text-neutral-400 transition-all" type="button">
<span class="material-icons text-[20px] mb-1">female</span>
<span class="text-xs font-medium">Female</span>
</button>
<button class="flex flex-col items-center justify-center py-3 px-2 rounded-2xl bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 hover:border-primary/50 hover:text-primary text-neutral-500 dark:text-neutral-400 transition-all" type="button">
<span class="material-icons text-[20px] mb-1">transgender</span>
<span class="text-xs font-medium">Other</span>
</button>
</div>
</div>
<div class="group">
<label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2 ml-1" for="phone">Contact Number</label>
<div class="flex gap-3">
<div class="relative w-[100px]">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
<span class="text-xl">🇺🇸</span>
</div>
<select class="block w-full pl-10 pr-6 py-4 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-2xl text-neutral-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary appearance-none text-[15px] font-medium shadow-sm">
<option>+1</option>
<option>+44</option>
<option>+91</option>
</select>
<div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
<span class="material-icons text-neutral-400 text-[16px]">expand_more</span>
</div>
</div>
<div class="relative flex-1">
<input class="block w-full px-4 py-4 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-2xl text-neutral-900 dark:text-white placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm font-mono text-[15px] tracking-wide" id="phone" placeholder="(555) 000-0000" type="tel"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-icons text-neutral-400 text-[20px] group-focus-within:text-primary transition-colors">phone_iphone</span>
</div>
</div>
</div>
</div>
</form>
</div>
<div class="absolute bottom-0 left-0 right-0 px-6 pb-8 pt-4 bg-background-light dark:bg-background-dark border-t border-neutral-100 dark:border-neutral-800 z-30">
<button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold text-[17px] py-4 rounded-2xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
            Next Step
            <span class="material-icons text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="flex justify-center mt-6 pb-1">
<div class="w-32 h-1 bg-neutral-900/20 dark:bg-white/20 rounded-full"></div>
