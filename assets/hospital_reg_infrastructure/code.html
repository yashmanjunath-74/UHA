<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hospital Reg: Infrastructure</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0bda95",
                        "primary-dark": "#09b37a",
                        "background-light": "#f5f8f7",
                        "background-dark": "#10221c",
                        "surface-light": "#ffffff",
                        "surface-dark": "#162e26",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col antialiased">
<!-- Top Navigation Bar -->
<header class="px-6 pt-12 pb-4 flex items-center justify-between bg-surface-light dark:bg-surface-dark shadow-sm z-10 sticky top-0">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-icons text-gray-600 dark:text-gray-300">arrow_back</span>
</button>
<h1 class="text-lg font-semibold text-gray-800 dark:text-white">Registration</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Progress Indicator -->
<div class="px-6 py-6 bg-surface-light dark:bg-surface-dark border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-medium text-primary">Step 2 of 3</span>
<span class="text-xs text-gray-400">Infrastructure</span>
</div>
<div class="h-1.5 w-full bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full"></div>
</div>
</div>
<!-- Main Content: Scrollable Area -->
<main class="flex-1 overflow-y-auto px-6 py-6 pb-32">
<!-- Header Text -->
<div class="mb-8">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Infrastructure &amp; Services</h2>
<p class="text-gray-500 dark:text-gray-400 text-sm">Tell us about your facility's capacity and the specialized departments available.</p>
</div>
<!-- Form Fields -->
<form class="space-y-8" onsubmit="event.preventDefault();">
<!-- Bed Capacity Input -->
<div class="group">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="bed-capacity">
                    Total Bed Capacity
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons text-gray-400 text-lg">single_bed</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-gray-200 dark:border-gray-700 bg-white dark:bg-surface-dark rounded-xl focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all" id="bed-capacity" name="bed-capacity" placeholder="e.g., 150" type="number"/>
</div>
<p class="mt-1 text-xs text-gray-400">Include all general and ICU beds.</p>
</div>
<!-- Departments Multi-select -->
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">
                    Departments Available
                </label>
<div class="flex flex-wrap gap-2">
<!-- Selected Chips -->
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-primary text-white shadow-sm ring-1 ring-primary transition-all active:scale-95" type="button">
<span class="mr-1">General Medicine</span>
<span class="material-icons text-sm">check</span>
</button>
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-primary text-white shadow-sm ring-1 ring-primary transition-all active:scale-95" type="button">
<span class="mr-1">Emergency</span>
<span class="material-icons text-sm">check</span>
</button>
<!-- Unselected Chips -->
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-white dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-primary/50 hover:bg-primary/5 transition-all active:scale-95" type="button">
                        Cardiology
                    </button>
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-white dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-primary/50 hover:bg-primary/5 transition-all active:scale-95" type="button">
                        Pediatrics
                    </button>
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-white dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-primary/50 hover:bg-primary/5 transition-all active:scale-95" type="button">
                        Orthopedics
                    </button>
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-white dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-primary/50 hover:bg-primary/5 transition-all active:scale-95" type="button">
                        Neurology
                    </button>
<button class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium bg-white dark:bg-surface-dark text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-primary/50 hover:bg-primary/5 transition-all active:scale-95" type="button">
                        Oncology
                    </button>
<!-- Add Custom -->
<button class="inline-flex items-center px-3 py-2 rounded-full text-sm font-medium bg-primary/10 text-primary border border-dashed border-primary/40 hover:bg-primary/20 transition-all active:scale-95" type="button">
<span class="material-icons text-sm mr-1">add</span>
                        Other
                    </button>
</div>
</div>
<!-- License Upload -->
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Clinical Establishment License
                </label>
<div class="mt-1 flex justify-center px-6 pt-8 pb-8 border-2 border-primary border-dashed rounded-xl bg-primary/5 hover:bg-primary/10 transition-colors cursor-pointer group relative overflow-hidden">
<div class="space-y-2 text-center relative z-10">
<div class="mx-auto h-12 w-12 text-primary bg-white dark:bg-surface-dark rounded-full flex items-center justify-center shadow-sm">
<span class="material-icons text-2xl group-hover:scale-110 transition-transform">cloud_upload</span>
</div>
<div class="flex text-sm text-gray-600 dark:text-gray-400 justify-center">
<span class="relative cursor-pointer rounded-md font-medium text-primary hover:text-primary-dark focus-within:outline-none">
<span>Upload a file</span>
</span>
<p class="pl-1">or drag and drop</p>
</div>
<p class="text-xs text-gray-500 dark:text-gray-500">
                            PDF, JPG, PNG up to 10MB
                        </p>
</div>
<!-- Decorative subtle pattern overlay -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none bg-[radial-gradient(#0bda95_1px,transparent_1px)] [background-size:16px_16px]" data-alt="Subtle dot pattern for upload area background"></div>
</div>
<!-- Example of an uploaded file state (hidden by default, shown for design context) -->
<!-- 
                <div class="mt-4 flex items-center justify-between p-3 bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 rounded-lg shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="h-10 w-10 bg-red-50 rounded-lg flex items-center justify-center">
                             <span class="material-icons text-red-500">picture_as_pdf</span>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-900 dark:text-white">license_document_2023.pdf</p>
                            <p class="text-xs text-gray-500">2.4 MB</p>
                        </div>
                    </div>
                    <button class="text-gray-400 hover:text-red-500">
                        <span class="material-icons">delete_outline</span>
                    </button>
                </div>
                -->
</div>
</form>
</main>
<!-- Footer Actions -->
<footer class="fixed bottom-0 left-0 right-0 bg-surface-light dark:bg-surface-dark border-t border-gray-100 dark:border-gray-800 p-6 z-20 pb-8 sm:pb-6">
<div class="flex items-center justify-between gap-4 max-w-md mx-auto w-full">
<button class="flex-1 py-3.5 px-6 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-surface-dark hover:bg-gray-50 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                Back
            </button>
<button class="flex-1 py-3.5 px-6 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-95 shadow-primary/30 hover:shadow-primary/50">
                Next Step
            </button>
</div>
</footer>
</body></html>
