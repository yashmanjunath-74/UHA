<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UHA Splash Screen</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#009669", // The specific Emerald Green requested
                        secondary: "#10b981", // Slightly lighter emerald for gradients
                        "background-light": "#ffffff", // Clean white background as requested
                        "background-dark": "#022c22", // Very dark emerald for dark mode
                        "accent-light": "#d1fae5", // Light emerald accent
                        "accent-dark": "#064e3b", // Dark emerald accent
                    },
                    fontFamily: {
                        sans: ["Poppins", "sans-serif"],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        };
    </script>
<style>.wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: linear-gradient(180deg, rgba(209, 250, 229, 0) 0%, rgba(16, 185, 129, 0.1) 100%);
            z-index: 0;
            clip-path: ellipse(150% 100% at 50% 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-sans h-screen flex flex-col items-center justify-center relative overflow-hidden transition-colors duration-300">
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-20 -right-20 w-80 h-80 bg-accent-light/40 dark:bg-secondary/10 rounded-full blur-3xl"></div>
<div class="absolute top-1/4 -left-20 w-60 h-60 bg-accent-light/40 dark:bg-primary/10 rounded-full blur-3xl"></div>
</div>
<div class="z-10 flex flex-col items-center animate-float">
<div class="relative w-32 h-32 mb-6 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-br from-secondary to-primary rounded-2xl rotate-3 opacity-20 dark:opacity-30"></div>
<div class="absolute inset-0 bg-gradient-to-br from-secondary to-primary rounded-2xl -rotate-3 opacity-20 dark:opacity-30"></div>
<div class="relative w-24 h-28 bg-gradient-to-b from-primary to-secondary rounded-b-full rounded-t-2xl shadow-xl flex items-center justify-center text-white">
<div class="relative">
<span class="material-icons-round text-5xl drop-shadow-md">cloud_done</span>
<div class="absolute -top-1 -right-1 w-3 h-3 bg-white rounded-full animate-pulse"></div>
</div>
</div>
</div>
<h1 class="text-4xl font-bold text-gray-900 dark:text-white tracking-tight mb-2">
            UHA
        </h1>
<p class="text-lg font-medium text-primary dark:text-secondary tracking-wide uppercase text-opacity-90">
            Universal Health App
        </p>
</div>
<div class="z-10 absolute bottom-20 flex flex-col items-center w-full px-8">
<div class="mb-8 relative w-10 h-10 animate-spin-slow text-primary">
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-2.5 h-full bg-primary rounded-full"></div>
<div class="h-2.5 w-full bg-primary rounded-full absolute"></div>
</div>
</div>
<p class="text-gray-500 dark:text-gray-400 font-medium text-sm tracking-widest uppercase mb-1">
            One ID. Universal Care.
        </p>
<div class="mt-4 flex space-x-1">
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0s"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
</div>
</div>
<div class="wave-bottom dark:opacity-30"></div>
<div class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-white to-transparent dark:from-background-dark opacity-60 z-10"></div>
<svg class="absolute bottom-0 left-0 w-full h-auto text-accent-light/50 dark:text-secondary/5 z-0" preserveAspectRatio="none" viewBox="0 0 1440 320">

</svg>

</body></html>
