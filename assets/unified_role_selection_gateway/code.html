<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>UHA - Role Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#009468",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231d",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex flex-col text-slate-800 dark:text-slate-100">
<!-- Status Bar Spacer (iOS) -->
<div class="h-12 w-full"></div>
<main class="flex-grow px-6 flex flex-col items-center justify-center">
<!-- Brand/Logo Section -->
<div class="mb-10 text-center">
<div class="w-16 h-16 bg-primary/10 dark:bg-primary/20 rounded-xl flex items-center justify-center mx-auto mb-4 border border-primary/20">
<span class="material-icons-round text-primary text-4xl">health_and_safety</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">Welcome to UHA</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">Select your role to continue</p>
</div>
<!-- Role Grid -->
<div class="grid grid-cols-2 gap-4 w-full max-w-sm">
<!-- Patient Card -->
<button class="group flex flex-col items-center justify-center bg-white dark:bg-emerald-950/30 p-6 rounded-xl border-2 border-transparent hover:border-primary/50 active:scale-95 transition-all shadow-sm shadow-primary/5">
<div class="w-14 h-14 bg-primary/5 dark:bg-primary/10 rounded-full flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition-colors text-primary">
<span class="material-icons-round text-3xl">person</span>
</div>
<span class="font-bold text-slate-900 dark:text-white text-base">Patient</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Seeking Care</span>
</button>
<!-- Doctor Card -->
<button class="group flex flex-col items-center justify-center bg-white dark:bg-emerald-950/30 p-6 rounded-xl border-2 border-transparent hover:border-primary/50 active:scale-95 transition-all shadow-sm shadow-primary/5">
<div class="w-14 h-14 bg-primary/5 dark:bg-primary/10 rounded-full flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition-colors text-primary">
<span class="material-icons-round text-3xl">medical_services</span>
</div>
<span class="font-bold text-slate-900 dark:text-white text-base">Doctor</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1 text-center leading-tight">Providing Care</span>
</button>
<!-- Hospital Card -->
<button class="group flex flex-col items-center justify-center bg-white dark:bg-emerald-950/30 p-6 rounded-xl border-2 border-transparent hover:border-primary/50 active:scale-95 transition-all shadow-sm shadow-primary/5">
<div class="w-14 h-14 bg-primary/5 dark:bg-primary/10 rounded-full flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition-colors text-primary">
<span class="material-icons-round text-3xl">domain</span>
</div>
<span class="font-bold text-slate-900 dark:text-white text-base">Hospital</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Admin &amp; Lab</span>
</button>
<!-- Pharmacy Card -->
<button class="group flex flex-col items-center justify-center bg-white dark:bg-emerald-950/30 p-6 rounded-xl border-2 border-transparent hover:border-primary/50 active:scale-95 transition-all shadow-sm shadow-primary/5">
<div class="w-14 h-14 bg-primary/5 dark:bg-primary/10 rounded-full flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition-colors text-primary">
<span class="material-icons-round text-3xl">medication</span>
</div>
<span class="font-bold text-slate-900 dark:text-white text-base">Pharmacy</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Fulfillment</span>
</button>
</div>
<!-- Illustration (Decorative) -->
<div class="mt-12 opacity-50 dark:opacity-20 grayscale">
<img alt="Illustration of medical network" class="w-48 h-auto object-contain" data-alt="Abstract emerald green medical network illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3pmmlFf6l_z6JdcDVWHD6vGGb0Gn90gYE4bUheBuNLgmJUsc70OPnrvLG996iuJ3l81ADxs7aiG5wvDeaRbap_P6PtJM2XLC35l1voxUOx-8DRe0ZrrR6dxGxyOTAKyRNSFdaY39ZfRlVxEQmW1LzpyOZ2yGPOi-T1_DTRd-6zH_S1sidA58OrYQCJTyz6V07htPrjTF_YIgxkSnVLMG8ITJXm1hBk9P7T9riem0MiZ2CeKHhIpwcZQayvAF_BvrXvk7Mrj1MN6T0"/>
</div>
</main>
<!-- Footer Action -->
<footer class="p-8 text-center space-y-4">
<div class="text-sm text-slate-500 dark:text-slate-400">
            New organization? 
            <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4" href="#">Register here</a>
</div>
<div class="pt-4 border-t border-primary/10">
<button class="inline-flex items-center gap-2 text-xs font-medium text-slate-400 dark:text-slate-500 uppercase tracking-widest hover:text-primary transition-colors">
<span class="material-icons-round text-sm">help_outline</span>
                Need help? Contact Support
            </button>
</div>
<!-- iOS Home Indicator Space -->
<div class="h-6"></div>
</footer>
</body></html>
